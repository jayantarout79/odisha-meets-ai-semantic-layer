# One row per download. downloader_key is an md5 of the email: lets us count unique people
# without exposing who they are.
cubes:
  - name: downloads
    sql_table: analytics.v_resource_downloads
    title: Resource downloads

    joins:
      - name: resources
        relationship: many_to_one
        sql: "{CUBE}.resource_id = {resources.id}"

    measures:
      - name: count
        title: Downloads
        type: count

      - name: unique_downloaders
        title: Unique downloaders
        type: count_distinct
        sql: downloader_key

      - name: downloads_per_person
        title: Downloads per person
        type: number
        sql: "ROUND(1.0 * {count} / NULLIF({unique_downloaders}, 0), 1)"

    dimensions:
      - name: id
        sql: id
        type: string
        primary_key: true

      - name: created_at
        title: Download date
        sql: created_at
        type: time
