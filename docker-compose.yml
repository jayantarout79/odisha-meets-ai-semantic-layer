# Odisha Meets AI analytics stack (local learning setup)
#   cube      : Cube Core semantic layer (dev mode ON -> never expose to the internet)
#   dashboard : Spring Boot dashboard that reads ONLY from Cube's REST API
services:
  cube:
    image: cubejs/cube:latest        # pin a version (e.g. cubejs/cube:v1.8.26) once things work
    ports:
      - "4000:4000"     # Playground + REST/GraphQL API
      - "15432:15432"   # SQL API (Postgres wire protocol)
    env_file: .env
    volumes:
      - .:/cube/conf    # data model in ./model is picked up live

  dashboard:
    build: ./dashboard
    ports:
      - "8080:8080"
    environment:
      CUBE_API_URL: http://cube:4000/cubejs-api/v1
      CUBE_API_SECRET: ${CUBEJS_API_SECRET}   # read from .env by docker compose
    depends_on:
      - cube
